<style>
/* Layout: ferramenta de campo em coluna única, pensada para o polegar; faixa de etapas no topo, navegação fixa embaixo */
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --ink: #142030;
  --muted: #5A6779;
  --line: #D3DAE3;
  --accent: #1C4FD6;
  --accent-soft: #E3EAFC;
  --on-accent: #FFFFFF;
  --ok: #1D7A4C;
  --ok-soft: #E1F2E9;
  --p1: #B42318;
  --p1-soft: #FCE6E4;
  --p2: #C2560C;
  --p2-soft: #FDEEDF;
  --p3: #8A6A00;
  --p3-soft: #F8F0D2;
  --grid: rgba(28, 79, 214, .07);
  --shadow: 0 1px 2px rgba(20, 32, 48, .06), 0 4px 14px rgba(20, 32, 48, .06);
  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131A; --surface: #151F2A; --ink: #E5EBF2; --muted: #93A1B2; --line: #2A3747;
    --accent: #7AA2FF; --accent-soft: #1B2A47; --on-accent: #0D131A;
    --ok: #4CC38A; --ok-soft: #12301F; --p1: #F27B72; --p1-soft: #3A1714;
    --p2: #F3A35C; --p2-soft: #3A2412; --p3: #E2C55A; --p3-soft: #33290C;
    --grid: rgba(122, 162, 255, .06); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131A; --surface: #151F2A; --ink: #E5EBF2; --muted: #93A1B2; --line: #2A3747;
  --accent: #7AA2FF; --accent-soft: #1B2A47; --on-accent: #0D131A;
  --ok: #4CC38A; --ok-soft: #12301F; --p1: #F27B72; --p1-soft: #3A1714;
  --p2: #F3A35C; --p2-soft: #3A2412; --p3: #E2C55A; --p3-soft: #33290C;
  --grid: rgba(122, 162, 255, .06); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: .005em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 18px 18px; }
.top-row { display: flex; align-items: center; gap: 10px; padding-block: 12px; min-height: 60px; }
.top-row h1 { font-size: 24px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.icon-btn svg { width: 22px; height: 22px; }

/* faixa de etapas */
.steps { display: flex; gap: 6px; overflow-x: auto; padding-block: 0 12px; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.step { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; }
.step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px; background: var(--bg); color: var(--muted); }
.step.done .n { background: var(--ok-soft); color: var(--ok); }
.step.cur { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.step.cur .n { background: var(--accent); color: var(--on-accent); }

main { padding-block: 18px 120px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 16px; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--p1); border-color: var(--p1); background: transparent; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }

/* home */
.hero { padding-block: 6px 4px; display: flex; flex-direction: column; gap: 6px; }
.hero h2 { font-size: 30px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.v-card { display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; }
.v-card h3 { font-size: 21px; }
.v-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--bg); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--bg); color: var(--muted); }
.chip.p1 { background: var(--p1-soft); color: var(--p1); }
.chip.p2 { background: var(--p2-soft); color: var(--p2); }
.chip.p3 { background: var(--p3-soft); color: var(--p3); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ex { background: var(--accent-soft); color: var(--accent); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }

/* formulário */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 15px; }
.field input, .field select, .field textarea, textarea.obs { width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
textarea { resize: vertical; min-height: 80px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

/* etapa */
.etapa-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.etapa-head h2 { font-size: 30px; }
.etapa-head p { margin: 0; color: var(--muted); max-width: 62ch; }
.help-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px 0 10px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.help-btn .q { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; }

.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; border-left: 5px solid var(--line); }
.item.s-ok { border-left-color: var(--ok); }
.item.s-na { border-left-color: var(--muted); }
.item.s-irr.p-1 { border-left-color: var(--p1); }
.item.s-irr.p-2 { border-left-color: var(--p2); }
.item.s-irr.p-3 { border-left-color: var(--p3); }
.item-top { display: flex; gap: 10px; align-items: flex-start; }
.item-top .code { font-family: var(--f-mono); font-size: 13px; color: var(--muted); padding-top: 2px; flex: none; min-width: 34px; }
.item-top .txt { flex: 1; min-width: 0; font-weight: 500; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"].ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.seg button[aria-pressed="true"].irr { background: var(--p1); border-color: var(--p1); color: var(--surface); }
.seg button[aria-pressed="true"].na { background: var(--muted); border-color: var(--muted); color: var(--surface); }
.irr-box { display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }
.irr-box .lbl { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
.prio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.prio button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; line-height: 1.1; }
.prio button small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.prio button[aria-pressed="true"][data-p="1"] { background: var(--p1-soft); border-color: var(--p1); color: var(--p1); }
.prio button[aria-pressed="true"][data-p="2"] { background: var(--p2-soft); border-color: var(--p2); color: var(--p2); }
.prio button[aria-pressed="true"][data-p="3"] { background: var(--p3-soft); border-color: var(--p3); color: var(--p3); }
.tipo { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tipo button { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.tipo button[aria-pressed="true"] { border-color: var(--ink); background: var(--bg); font-weight: 600; }
.fotos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.thumb { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); background: var(--bg); padding: 0; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.add-foto { width: 72px; height: 72px; border-radius: 10px; border: 1.5px dashed var(--muted); background: transparent; display: grid; place-items: center; color: var(--muted); font-size: 12px; font-weight: 600; text-align: center; line-height: 1.15; padding: 4px; }
.add-foto svg { width: 22px; height: 22px; margin: 0 auto 2px; display: block; }

.section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.section-title h3 { font-size: 20px; }
.comodo { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.comodo-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; width: 100%; background: transparent; border: 0; text-align: left; }
.comodo-head .t { flex: 1; min-width: 0; }
.comodo-head h3 { font-size: 20px; }
.comodo-head .chev { width: 22px; height: 22px; transition: transform .2s; flex: none; color: var(--muted); }
.comodo[data-open="1"] .chev { transform: rotate(180deg); }
.comodo-body { padding: 0 12px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); padding-top: 12px; border-top: 1px solid var(--line); }
.add-comodo { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
@media (max-width: 520px) { .add-comodo { grid-template-columns: 1fr 1fr; } .add-comodo .btn { grid-column: 1 / -1; } }
.add-item { display: flex; gap: 8px; }
.add-item input { flex: 1; min-width: 0; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--p1-soft); color: var(--p1); font-weight: 600; font-size: 14px; }

/* navegação inferior */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bottom .wrap { display: flex; gap: 10px; padding-block: 10px; }
.bottom .btn { flex: 1; }

/* modal de ajuda */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 24, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 800px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px; } }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; }
.sheet-head h2 { font-size: 26px; flex: 1; }
.h-block { display: flex; flex-direction: column; gap: 6px; }
.h-block h3 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
.h-block h3 .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.h-block ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }
.h-block p { margin: 0; max-width: 65ch; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0 !important; }
.tools li { padding: 6px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; }
.ref { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.photo-view { width: 100%; border-radius: 12px; }

/* relatório */
.rep-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 480px) { .rep-sum { grid-template-columns: repeat(2, 1fr); } }
.rep-sum div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.rep-sum b { display: block; font-family: var(--f-display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.rep-sum span { font-size: 13px; color: var(--muted); }
.rep-item { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rep-item:last-child { border-bottom: 0; }
.rep-item .where { font-size: 13px; color: var(--muted); }
.rep-item .fotos .thumb { width: 96px; height: 96px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.note { font-size: 14px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print { .top, .bottom, .no-print { display: none !important; } body { background: #fff; } main { padding: 0; } }
.instalar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 25; width: min(560px, calc(100% - 32px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-size: 14px; }
.instalar img { width: 40px; height: 40px; border-radius: 9px; flex: none; }
.instalar p { margin: 0; flex: 1; }
.instalar button { border: 0; border-radius: 9px; padding: 8px 12px; font-weight: 600; }
.instalar .sim { background: var(--accent); color: var(--on-accent); }
.instalar .nao { background: transparent; color: var(--muted); }
</style>

<style>

.seg button { min-height: 52px; font-size: 16px; }
.seg button[aria-pressed="true"].irr { background: var(--p1); border-color: var(--p1); color: var(--surface); }

</style>

/* ---------------------------------------------------------------
   Armazenamento no aparelho (IndexedDB, com reserva em localStorage)
---------------------------------------------------------------- */
const DB_NAME = "vistoria-recebimento", DB_VER = 1;
let dbp = null;
function db() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); if (!d.objectStoreNames.contains("fotos")) d.createObjectStore("fotos"); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbp;
}
async function idbGet(store, key) {
  const d = await db();
  return new Promise((res, rej) => { const q = d.transaction(store).objectStore(store).get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbPut(store, key, val) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, "readwrite"); t.objectStore(store).put(val, key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
}
async function idbDel(store, key) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, "readwrite"); t.objectStore(store).delete(key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
}
let storageOk = true;
const LS_KEY = "vistorias-receb";
async function loadData() {
  try { const v = await idbGet("kv", "vistorias"); if (v) return v; } catch (e) { storageOk = false; }
  try { const s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch (e) {}
  return null;
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const data = JSON.parse(JSON.stringify(S.vistorias));
    try { await idbPut("kv", "vistorias", data); storageOk = true; }
    catch (e) {
      storageOk = false;
      try { localStorage.setItem(LS_KEY, JSON.stringify(data)); storageOk = true; } catch (e2) {}
    }
    if (!storageOk) toast("Não foi possível salvar neste navegador. Faça um backup.");
  }, 300);
}
const fotoCache = new Map();
async function getFoto(id) {
  if (fotoCache.has(id)) return fotoCache.get(id);
  try { const f = await idbGet("fotos", id); if (f) fotoCache.set(id, f); return f || null; } catch (e) { return null; }
}
async function putFoto(id, data) {
  fotoCache.set(id, data);
  try { await idbPut("fotos", id, data); } catch (e) { toast("A foto ficou só nesta sessão. O navegador não permitiu salvar."); }
}
async function delFoto(id) { fotoCache.delete(id); try { await idbDel("fotos", id); } catch (e) {} }

const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

function itensDe(v, e) {
  const n = ETAPAS.indexOf(e) + 1;
  const list = e.itens.map((t, i) => ({ key: e.id + ":" + i, txt: t, code: n + "." + (i + 1) }));
  (v.extras[e.id] || []).forEach((x, j) => list.push({ key: e.id + ":x:" + x.id, txt: x.txt, code: n + "." + (e.itens.length + j + 1), extra: x.id }));
  return list;
}
function contar(v, list) {
  const r = { total: list.length, ok: 0, na: 0, irr: 0, p1: 0, p2: 0, p3: 0 };
  list.forEach((it) => { const a = v.resp[it.key]; if (!a || !a.s) return; r[a.s]++; if (a.s === "irr") r["p" + (a.p || 2)]++; });
  r.feito = r.ok + r.na + r.irr; r.pend = r.total - r.feito;
  return r;
}
const contarTudo = (v) => contar(v, ETAPAS.flatMap((e) => itensDe(v, e)));

function barra(c) {
  if (!c.total) return '<div class="bar"></div>';
  const w = (n) => (n / c.total * 100).toFixed(1) + "%";
  return '<div class="bar" aria-hidden="true"><span style="width:' + w(c.ok + c.na) + ';background:var(--ok)"></span><span style="width:' + w(c.p3) + ';background:var(--p3)"></span><span style="width:' + w(c.p2) + ';background:var(--p2)"></span><span style="width:' + w(c.p1) + ';background:var(--p1)"></span></div>';
}

  let h = '<span class="chip mono">' + c.feito + "/" + c.total + " itens</span>";
  if (c.irr) h += '<span class="chip p1">' + c.irr + (c.irr === 1 ? " problema" : " problemas") + "</span>";

}

function vFechamentoTopo(v) {
  const c = contarTudo(v);

  const pend = ETAPAS.map((e, i) => ({ e, i, c: contar(v, itensDe(v, e)) })).filter((x) => x.c.pend > 0 && !x.e.fechamento);
  if (pend.length) h += '<div class="note">Passos com itens sem resposta: ' + pend.map((x) => '<button class="link" data-a="etapa" data-i="' + x.i + '">' + (x.i + 1) + ". " + esc(x.e.curto) + " (" + x.c.pend + ")</button>").join(", ") + "</div>";

  if (semFoto) h += '<div class="note">' + semFoto + (semFoto === 1 ? " problema está sem foto." : " problemas estão sem foto.") + " Foto é a sua prova na hora de cobrar o reparo.</div>";

}

function vMedidas(v) {
  const rows = v.medidas || [];
  let h = '<section class="card stack"><div><h3 style="font-size:20px">Tabela de metragem</h3><p class="muted" style="margin:4px 0 0;font-size:14px">Área de cada ambiente em m² (comprimento × largura). Diferença acima de 3% fica em vermelho.</p></div>';

  if (rows.length) h += '<div class="med-row med-head"><span>Ambiente</span><span>Planta</span><span>Medido</span><span></span></div>';
  rows.forEach((r) => {
    const p = num(r.planta), m = num(r.real);
    let dif = "";
    if (p && m) { const d = m - p; const pct = d / p * 100; dif = '<span class="dif ' + (Math.abs(pct) > 3 ? "bad" : "ok") + '">' + (d >= 0 ? "+" : "") + fmtNum(d) + " m² (" + (pct >= 0 ? "+" : "") + pct.toFixed(1).replace(".", ",") + "%)</span>"; }
    h += '<div class="med-row"><input aria-label="Ambiente" data-med="' + r.id + '" data-campo="amb" value="' + esc(r.amb) + '" placeholder="Ambiente">';
    h += '<input class="num" aria-label="Área na planta" inputmode="decimal" data-med="' + r.id + '" data-campo="planta" value="' + esc(r.planta) + '" placeholder="0,00">';
    h += '<input class="num" aria-label="Área medida" inputmode="decimal" data-med="' + r.id + '" data-campo="real" value="' + esc(r.real) + '" placeholder="0,00">';

function difHtml(r) {
  const p = num(r.planta), m = num(r.real);

  const d = m - p, pct = d / p * 100;
  return '<span class="dif ' + (Math.abs(pct) > 3 ? "bad" : "ok") + '">' + (d >= 0 ? "+" : "") + fmtNum(d) + " m² (" + (pct >= 0 ? "+" : "") + pct.toFixed(1).replace(".", ",") + "%)</span>";
}

function vAddItem(etapaId) {

function irregularidades(v) {
  const out = [];
  ETAPAS.forEach((e) => itensDe(v, e).forEach((it) => { const a = v.resp[it.key]; if (a && a.s === "irr") out.push({ it, a, e }); }));
  return out.sort((x, y) => (x.a.p || 2) - (y.a.p || 2));
}

function textoRelatorio(v) {
  const c = contarTudo(v);
  const L = [];
  L.push("VISTORIA DE RECEBIMENTO DO IMÓVEL");
  L.push("Imóvel: " + v.nome);
  if (v.empreend) L.push("Empreendimento: " + v.empreend);
  if (v.construtora) L.push("Construtora: " + v.construtora);
  if (v.endereco) L.push("Endereço: " + v.endereco);
  L.push("Data: " + fmtData(v.data));
  if (v.responsavel) L.push("Vistoriado por: " + v.responsavel);
  L.push("");
  L.push("Itens conferidos: " + c.feito + " de " + c.total + ". Problemas: " + c.irr + " (" + c.p1 + " graves, " + c.p2 + " moderados, " + c.p3 + " leves).");
  L.push("");
  L.push("PROBLEMAS ENCONTRADOS");
  const irr = irregularidades(v);
  if (!irr.length) L.push("Nenhum.");
  irr.forEach((x, i) => {
    const p = x.a.p || 2;
    L.push((i + 1) + ". [" + PRIO_TXT[p].toUpperCase() + "] " + x.it.txt + (x.a.locais && x.a.locais.length ? " | Local: " + x.a.locais.join(", ") : "") + (x.a.fotos && x.a.fotos.length ? " | " + x.a.fotos.length + " foto(s)" : ""));
    if (x.a.obs) L.push("   " + x.a.obs);
  });
  const meds = (v.medidas || []).filter((r) => r.amb || r.planta || r.real);
  if (meds.length) {
    L.push(""); L.push("METRAGEM (planta / medido, em m²)");
    meds.forEach((r) => { const p = num(r.planta), m = num(r.real); L.push(r.amb + ": " + (r.planta || "-") + " / " + (r.real || "-") + (p && m ? " (" + ((m - p) / p * 100).toFixed(1).replace(".", ",") + "%)" : "")); });
  }
  const notas = ETAPAS.filter((e) => v.notas[e.id]);
  if (notas.length) { L.push(""); L.push("ANOTAÇÕES"); notas.forEach((e) => L.push(e.nome + ": " + v.notas[e.id])); }
  return L.join("\n");
}

/* ---------------------------------------------------------------
   Ações
---------------------------------------------------------------- */
function touch(v) { v.upd = Date.now(); save(); }
function resp(v, k) { return v.resp[k] || (v.resp[k] = {}); }
let toastT = null;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
async function copiar(txt, okMsg) {
  try { await navigator.clipboard.writeText(txt); toast(okMsg); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove(); toast(ok ? okMsg : "Não foi possível copiar neste aparelho.");
  }
}

function novaVistoria(d) {
  return { id: uid(), nome: d.nome, empreend: d.empreend, construtora: d.construtora, endereco: d.endereco, data: d.data, responsavel: d.responsavel,
    resp: {}, extras: {}, notas: {}, medidas: ["Sala", "Cozinha", "Quarto 1", "Banheiro social"].map((amb) => ({ id: uid(), amb, planta: "", real: "" })), upd: Date.now() };
}

let fotoAlvo = null;
const fotoInput = document.getElementById("foto-input");
fotoInput.addEventListener("change", async () => {
  const file = fotoInput.files && fotoInput.files[0];
  fotoInput.value = "";
  if (!file || !fotoAlvo) return;
  try {
    const data = await comprimir(file);
    const id = "f" + uid();
    await putFoto(id, data);
    const v = cur(); const a = resp(v, fotoAlvo);
    (a.fotos || (a.fotos = [])).push(id);
    touch(v); keepScroll(render); toast("Foto salva");
  } catch (e) { toast("Não consegui ler essa imagem. Tente outra."); }
});
function comprimir(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1400; let w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w, h) > max) { const r = max / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

const importInput = document.getElementById("import-input");
importInput.addEventListener("change", () => {
  const file = importInput.files && importInput.files[0]; importInput.value = "";
  if (!file) return;
  const r = new FileReader(); r.onload = () => importar(String(r.result)); r.readAsText(file);
});
async function importar(txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { toast("Esse texto não é um backup válido."); return; }
  if (!d || !Array.isArray(d.vistorias) || d.app !== "vistoria-recebimento") { toast("Esse texto não é um backup deste app."); return; }
  for (const [id, data] of Object.entries(d.fotos || {})) await putFoto(id, data);
  d.vistorias.forEach((nv) => { const i = S.vistorias.findIndex((v) => v.id === nv.id); if (i >= 0) S.vistorias[i] = nv; else S.vistorias.push(nv); });
  save(); S.view = "home"; render(); toast(d.vistorias.length + " vistoria(s) restaurada(s)");
}
async function exportar() {
  const fotos = {};
  for (const v of S.vistorias) for (const a of Object.values(v.resp)) for (const f of (a.fotos || [])) { const d = await getFoto(f); if (d) fotos[f] = d; }
  const txt = JSON.stringify({ app: "vistoria-recebimento", versao: 2, exportado: new Date().toISOString(), vistorias: S.vistorias, fotos });
  if (!framed) {
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" })); a.download = "vistorias-backup-" + hoje() + ".json";
      document.body.appendChild(a); a.click(); a.remove(); toast("Backup baixado"); return;
    } catch (e) {}
  }
  copiar(txt, "Backup copiado (" + Math.round(txt.length / 1024) + " KB)");
}

app.addEventListener("submit", (ev) => {
  if (ev.target.id !== "f-vist") return;
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(ev.target).entries());
  if (S.view === "editar") { Object.assign(cur(), fd); touch(cur()); S.view = "vistoria"; }
  else { const v = novaVistoria(fd); S.vistorias.push(v); save(); S.id = v.id; S.etapa = 0; S.view = "vistoria"; }
  S.confirm = null; render(); window.scrollTo(0, 0);
});

app.addEventListener("input", (ev) => {
  const t = ev.target; const v = cur(); if (!v) return;
  if (t.dataset.obs) { resp(v, t.dataset.obs).obs = t.value; touch(v); }
  else if (t.dataset.nota) { v.notas[t.dataset.nota] = t.value; touch(v); }
  else if (t.dataset.med) {
    const r = (v.medidas || []).find((x) => x.id === t.dataset.med); if (!r) return;
    r[t.dataset.campo] = t.value; touch(v);
    const d = app.querySelector('[data-dif="' + r.id + '"]'); if (d) d.innerHTML = difHtml(r);
  }
});
app.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.ai) { ev.preventDefault(); addItem(ev.target.dataset.ai); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && S.sheet) { S.sheet = null; S.confirm = null; keepScroll(render); } });

function addItem(etapaId) {
  const v = cur(); const inp = document.querySelector('[data-ai="' + etapaId + '"]'); const txt = inp && inp.value.trim();
  if (!txt) { inp && inp.focus(); return; }
  (v.extras[etapaId] || (v.extras[etapaId] = [])).push({ id: uid(), txt });
  touch(v); keepScroll(render);
}

app.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a;
  if (a === "fechar-bg" && ev.target !== b) return;
  const v = cur();
  const k = b.dataset.k;
  switch (a) {
    case "nova": S.view = "nova"; S.confirm = null; render(); window.scrollTo(0, 0); break;
    case "abrir": S.id = b.dataset.id; S.etapa = 0; S.view = "vistoria"; S.sheet = null; render(); window.scrollTo(0, 0); break;
    case "home": S.view = "home"; S.sheet = null; S.confirm = null; render(); window.scrollTo(0, 0); break;
    case "backup": S.view = "backup"; render(); window.scrollTo(0, 0); break;
    case "editar": S.view = "editar"; S.confirm = null; render(); window.scrollTo(0, 0); break;
    case "voltar-form": S.view = S.view === "editar" && cur() ? "vistoria" : "home"; S.confirm = null; render(); break;
    case "voltar-rel": S.view = "vistoria"; S.sheet = null; render(); window.scrollTo(0, 0); break;
    case "relatorio": S.view = "relatorio"; S.sheet = null; render(); window.scrollTo(0, 0); break;
    case "etapa": S.etapa = +b.dataset.i; S.sheet = null; S.confirm = null; render(); window.scrollTo(0, 0); scrollStep(); break;
    case "prev": S.etapa = Math.max(0, S.etapa - 1); render(); window.scrollTo(0, 0); scrollStep(); break;
    case "next": S.etapa = Math.min(ETAPAS.length - 1, S.etapa + 1); render(); window.scrollTo(0, 0); scrollStep(); break;
    case "st": { const r = resp(v, k); r.s = r.s === b.dataset.s ? undefined : b.dataset.s; if (r.s === "irr" && !r.p) r.p = 2; touch(v); keepScroll(render); break; }
    case "prio": resp(v, k).p = +b.dataset.p; touch(v); keepScroll(render); break;
    case "local": { const r = resp(v, k); const l = b.dataset.l; r.locais = r.locais || []; r.locais = r.locais.includes(l) ? r.locais.filter((x) => x !== l) : r.locais.concat(l); touch(v); keepScroll(render); break; }
    case "obs": { resp(v, k).obs = " "; keepScroll(render); resp(v, k).obs = ""; const ta = document.querySelector('[data-obs="' + CSS.escape(k) + '"]'); if (ta) { ta.value = ""; ta.focus(); } break; }
    case "foto": fotoAlvo = k; fotoInput.click(); break;
    case "ver-foto": S.confirm = null; getFoto(b.dataset.f).then(() => { S.sheet = sheetFoto(k, b.dataset.f); keepScroll(render); }); break;
    case "del-foto": S.confirm = "del-f"; S.sheet = sheetFoto(k, b.dataset.f); keepScroll(render); break;
    case "del-foto-ok": { const r = resp(v, k); r.fotos = (r.fotos || []).filter((f) => f !== b.dataset.f); delFoto(b.dataset.f); S.sheet = null; S.confirm = null; touch(v); keepScroll(render); toast("Foto apagada"); break; }
    case "ajuda": { const e = ETAPAS.find((x) => x.id === b.dataset.e); S.sheet = sheetAjuda(e.nome, e.fechamento ? "Final · Ajuda" : "Passo " + (ETAPAS.indexOf(e) + 1) + " · Ajuda", e.ajuda); keepScroll(render); break; }
    case "ajuda-class": S.sheet = sheetClass(); keepScroll(render); break;
    case "fechar": case "fechar-bg": S.sheet = null; S.confirm = null; keepScroll(render); break;
    case "add-med": (v.medidas || (v.medidas = [])).push({ id: uid(), amb: "", planta: "", real: "" }); touch(v); keepScroll(render); { const ins = app.querySelectorAll('[data-campo="amb"]'); if (ins.length) ins[ins.length - 1].focus(); } break;
    case "del-med": v.medidas = (v.medidas || []).filter((r) => r.id !== b.dataset.id); touch(v); keepScroll(render); break;
    case "add-item": addItem(b.dataset.alvo); break;
    case "del-extra": {
      const parts = k.split(":");
      v.extras[parts[0]] = (v.extras[parts[0]] || []).filter((x) => x.id !== parts[2]);
      if (v.resp[k]) { (v.resp[k].fotos || []).forEach(delFoto); delete v.resp[k]; }
      touch(v); keepScroll(render); break;
    }
    case "cancel": S.confirm = null; keepScroll(render); break;
    case "del-vist": S.confirm = "del-vist"; render(); break;
    case "del-vist-ok": {
      Object.values(v.resp).forEach((r) => (r.fotos || []).forEach(delFoto));
      S.vistorias = S.vistorias.filter((x) => x.id !== v.id); S.id = null; S.confirm = null; S.view = "home"; save(); render(); toast("Vistoria apagada"); break;
    }
    case "copiar-rel": copiar(textoRelatorio(v), "Relatório copiado"); break;
    case "imprimir": window.print(); break;
    case "exportar": exportar(); break;
    case "importar-arq": importInput.click(); break;
    case "importar-txt": { const t = document.getElementById("imp-txt").value.trim(); if (t) importar(t); else toast("Cole o texto do backup primeiro."); break; }
  }
});
function scrollStep() { const s = document.querySelector(".step.cur"); if (s && s.scrollIntoView) s.scrollIntoView({ inline: "center", block: "nearest" }); }

/* ---------------------------------------------------------------
   Exemplo inicial (aparece só na primeira vez, pode ser apagado)
---------------------------------------------------------------- */
function exemplo() {
  const v = novaVistoria({ nome: "Apto 804, Torre A (exemplo)", empreend: "Residencial Jacarandá", construtora: "", endereco: "Rua das Palmeiras, 120", data: hoje(), responsavel: "" });
  v.exemplo = true;
  ["doc:0", "doc:1", "doc:2", "par:0", "par:2", "par:4"].forEach((k) => (v.resp[k] = { s: "ok" }));
  v.resp["doc:3"] = { s: "irr", p: 3, obs: "Quarto 1 com 0,4 m² a menos que a planta." };
  v.resp["par:1"] = { s: "irr", p: 1, locais: ["Banheiro social"], obs: "Mancha de umidade no teto, acima do box, com cerca de 30 cm." };
  v.resp["par:3"] = { s: "irr", p: 2, locais: ["Cozinha"], obs: "3 azulejos ocos atrás da pia. Marcados com fita crepe." };
  v.medidas[0].planta = "18,20"; v.medidas[0].real = "18,05";
  v.medidas[2].planta = "9,60"; v.medidas[2].real = "9,20";
  v.notas.doc = "Este é um exemplo para mostrar como o app funciona. Pode apagar quando quiser (botão de três pontos no topo da vistoria).";
  v.upd = Date.now() - 1000;
  return v;
}

(async function boot() {
  const data = await loadData();
  if (data && Array.isArray(data)) S.vistorias = data;
  else { S.vistorias = [exemplo()]; save(); }
  try { const ui = JSON.parse(localStorage.getItem("ui-receb") || "null"); if (ui && ui.id && S.vistorias.some((v) => v.id === ui.id)) { S.id = ui.id; S.etapa = Math.min(ui.etapa || 0, ETAPAS.length - 1); S.view = ui.view; } } catch (e) {}
  render();
  scrollStep();
})();
})();
</script>
<script>
/* Instalação no celular: guarda o app para abrir sem internet e mostra o convite para pôr na tela inicial */
(function () {
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const instalado = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  let dispensado = false;
  try { dispensado = localStorage.getItem("instalar-dispensado") === "1"; } catch (e) {}
  if (instalado || dispensado) return;
  function mostrar(texto, acao) {
    const el = document.createElement("div");
    el.className = "instalar"; el.setAttribute("role", "dialog");
    el.innerHTML = '<img src="icons/icon-192.png" alt=""><p>' + texto + '</p>' + (acao ? '<button class="sim">Instalar</button>' : '') + '<button class="nao" aria-label="Fechar">Agora não</button>';
    document.body.appendChild(el);
    el.querySelector(".nao").onclick = () => { el.remove(); try { localStorage.setItem("instalar-dispensado", "1"); } catch (e) {} };
    if (acao) el.querySelector(".sim").onclick = () => { el.remove(); acao(); };
    setTimeout(() => el.remove(), 20000);
  }
  addEventListener("beforeinstallprompt", (ev) => {
    ev.preventDefault();
    mostrar("Coloque o app na tela inicial para abrir como um aplicativo, mesmo sem internet.", () => ev.prompt());
  });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) setTimeout(() => mostrar("Para pôr na tela inicial, toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>."), 1500);
})();
</script>
